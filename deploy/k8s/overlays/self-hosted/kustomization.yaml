apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - vllm.yaml
patches:
  - target: {kind: ConfigMap, name: support-assistant-config}
    patch: |-
      - op: replace
        path: /data/DEPLOYMENT_MODE
        value: selfhosted
      - op: add
        path: /data/OPENAI_BASE_URL
        value: http://vllm.support-assistant.svc:8000/v1
      - op: add
        path: /data/LLM_MODEL
        value: REPLACE_ME            # the model name vLLM serves
      - op: add
        path: /data/EMBED_MODEL
        value: BAAI/bge-m3
