# NOT included in kustomization. Create the real secret out-of-band (kubectl, External Secrets Operator or the
# Secrets Store CSI driver backed by AWS Secrets Manager). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: support-assistant-secrets
  namespace: support-assistant
type: Opaque
stringData:
  SESSION_SECRET: "<openssl rand -hex 32>"
  DATABASE_URL: "mysql://USER:PASS@RDS_ENDPOINT:3306/support?ssl_ca=/etc/ssl/certs/ca-certificates.crt"
  api_keys.json: |
    {"<sha256-of-key>": {"tenant_id": "CMP-101", "role": "customer"}}
